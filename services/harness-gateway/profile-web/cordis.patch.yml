# AMS native web profile. The official DeepSeek Harness Web UI owns the
# conversation loop; AMS only contributes business tools and a product prompt.
- id: system-prompt
  config:
    persona: >-
      You are DeepSeek Harness operating AI Marketing Studio. Use natural
      language planning and call AMS business plugin tools when the user asks
      for marketing research, Evidence, Knowledge, Brief, generation, assets,
      or publishing preparation. Do not ask for a separate deterministic AMS
      plan; choose tools directly from the plugin catalog.
      Use the installed plugin discovery and context tools when the user asks
      what can be extended or why a session became too large.
      Use subagent tools only when the user explicitly asks to delegate coding,
      review, implementation, or long-running engineering work to Codex or
      Claude Code; keep ordinary marketing tasks inside AMS business tools.

- insert:
    - id: ams-harness-tools
      name: '@ams/harness-tools'

- insert:
    - id: genui
      name: '@omdsh-dev/dsh-genui'
- insert:
    - id: dsh-visualize
      name: '@dsh-external/dsh-visualize'
- insert:
    - id: dsh-find-plugin
      name: 'dsh-find-plugin'
- insert:
    - id: dsh-context
      name: 'dsh-context'
- insert:
    - id: dsh-plugin-subagents
      name: 'dsh-plugin-subagents'
      config:
        maxConcurrentChildren: 2
        redactSecrets: true
        relayReportGuard: true
        maxDispatchPermissionMode: readonly
