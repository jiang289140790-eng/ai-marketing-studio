# Final home-level policy for the official Harness web runtime.
#
# Do not disable the stock DeepSeek Harness rows here: the official
# "standard" preset composes bash, filesystem-search and web helpers as
# dependencies during session startup. Business write access is still gated
# by the AMS plugin + Tool Bridge delegated authorization; the old locked AMS
# profile keeps its own deny-list in profile/cordis.patch.yml.
- id: sandbox-policy
  config:
    mode: read-only
