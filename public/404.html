<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Marketing Studio</title>
    <script>
      (function () {
        var segments = window.location.pathname.split('/').filter(Boolean);
        var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        var route = segments.slice(1).join('/');
        var query = window.location.search || '';
        var hashRoute = route ? '#/' + route + query : '#/dashboard' + query;
        window.location.replace(base + hashRoute);
      })();
    </script>
  </head>
  <body>
    <p>正在打开 AI Marketing Studio...</p>
  </body>
</html>
