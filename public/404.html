<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Marketing Studio</title>
    <script>
      function redirectTarget(pathname, search) {
        var segments = String(pathname || '').split('/').filter(Boolean);
        var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        var route = segments.slice(1).join('/');
        var query = search || '';
        if (route === 'tasks' || route.indexOf('tasks/') === 0) {
          return base + '#/' + route + query;
        }
        if (!route) {
          return base + '#/dashboard' + query;
        }
        return pathname;
      }

      (function () {
        window.location.replace(redirectTarget(window.location.pathname, window.location.search || ''));
      })();
    </script>
  </head>
  <body>
    <p>正在打开 AI Marketing Studio...</p>
  </body>
</html>
