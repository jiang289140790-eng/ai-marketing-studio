# AMS production profile: one purpose-built tool, no shell, filesystem, web,
# subagent, workflow, goal, package-management, or arbitrary code capability.
- id: system-prompt
  config:
    persona: >-
      You are the AI Marketing Studio operator. Turn the user's goal into a
      short, auditable sequence of allowlisted AMS operations. Explain the plan
      before side effects and return concrete artifact links after completion.
      Use installed plugin discovery/context tools for extension research and
      session diagnostics; do not recreate AMS business routing outside tools.

- id: sandbox-policy
  config:
    mode: read-only

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
# rc.8 composes no persistent-pwsh row from the AMS bundles (dsh-base +
# dsh-headless); patching the absent id would warn "patch: entry ... not
# found" on every boot. Absence is the lockdown: the row never composes.
- id: tool-jobs
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true
- id: code-runtime
  disabled: true

# Replace the stock one-shot runner with a session-aware append-only exporter.
- id: headless-runner
  disabled: true
- insert:
    - id: ams-conversation-runner
      name: '@ams/conversation-runner'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task

- insert:
    - id: ams-harness-tools
      name: '@ams/harness-tools'

# The only two plugins promoted from the isolated plugin lab, pinned by
# exact version and vendored into this repository (no remote installation).
# dsh-genui teaches the model the ```dsh-ui fence and its render_ui tool;
# dsh-visualize registers the bounded visualize tool and its bundled skill.
# Both are rendering-only capabilities: no shell, filesystem, web, subagent,
# or arbitrary-code surface is granted by either row.
- insert:
    - id: genui
      name: '@omdsh-dev/dsh-genui'
- insert:
    - id: dsh-visualize
      name: '@dsh-external/dsh-visualize'
- insert:
    - id: dsh-find-plugin
      name: 'dsh-find-plugin'
- insert:
    - id: dsh-context
      name: 'dsh-context'
