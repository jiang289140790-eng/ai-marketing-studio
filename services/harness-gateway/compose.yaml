services:
  gateway:
    image: ams-harness-gateway:0.7.0-conversation-v1
    container_name: ams-harness-gateway
    restart: unless-stopped
    read_only: true
    init: true
    mem_limit: 1536m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      HARNESS_EXECUTABLE: /app/node_modules/.bin/dsh
      HARNESS_WORKSPACE: /workspace
      HARNESS_HOME: /data/harness
      HARNESS_EVENT_FILE: /data/gateway/events.jsonl
      HARNESS_CONVERSATION_JOURNAL: /data/gateway/conversations.jsonl
      HARNESS_PROJECTOR_ACK_FILE: /data/gateway/projected-events.log
      AMS_GATEWAY_HMAC_SECRET_FILE: /run/secrets/ams_gateway_hmac_secret
      DEEPSEEK_API_KEY: internal-model-proxy
      DEEPSEEK_BASE_URL: http://model-proxy:8791
      AMS_TOOL_BRIDGE_URL: https://xtkkdvghiohlnpfnnhmx.supabase.co/functions/v1/harness-tool-bridge
      AMS_CONVERSATION_CALLBACK_URL: https://xtkkdvghiohlnpfnnhmx.supabase.co
      AMS_TOOL_BRIDGE_SECRET_FILE: /run/secrets/ams_tool_bridge_secret
    secrets:
      - ams_gateway_hmac_secret
      - ams_tool_bridge_secret
    volumes:
      - harness_gateway_data:/data
      # rc.8 changed its SQLite storage format. Keep gateway events on the
      # existing audit volume while giving the Harness runtime a fresh home.
      - harness_runtime_rc8:/data/harness
      - harness_workspace:/workspace:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - harness_private
      - tool_egress

  model-proxy:
    image: ams-harness-gateway:0.7.0-conversation-v1
    container_name: ams-harness-model-proxy
    restart: unless-stopped
    read_only: true
    init: true
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    command: ["node", "model-proxy.mjs"]
    environment:
      HOST: 0.0.0.0
      MODEL_PROXY_PORT: 8791
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - deepseek_api_key
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - harness_private
      - model_egress

volumes:
  harness_gateway_data:
  harness_runtime_rc8:
  harness_workspace:

networks:
  harness_private:
    internal: true
  model_egress: {}
  tool_egress: {}

secrets:
  ams_gateway_hmac_secret:
    file: ${AMS_GATEWAY_HMAC_SECRET_FILE:?required}
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_FILE:?required}
  ams_tool_bridge_secret:
    file: ${AMS_TOOL_BRIDGE_SECRET_FILE:?required}
